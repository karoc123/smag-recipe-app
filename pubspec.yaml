name: smag
description: "SMAG – A quiet, offline-first recipe manager with Nextcloud Cookbook sync."
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  provider: ^6.1.2
  path_provider: ^2.1.6
  sqflite: ^2.4.4
  wakelock_plus: ^1.8.0
  google_fonts: ^8.2.1
  flutter_markdown_plus: ^1.0.12
  http: ^1.4.0
  html: ^0.15.5
  path: ^1.9.1
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  cached_network_image: ^4.0.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: smag_app_icon.png
  adaptive_icon_foreground: smag_app_icon.png
  adaptive_icon_background: "#F5F2ED"
  remove_alpha_ios: true
